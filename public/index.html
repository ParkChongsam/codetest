<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List - 할 일 관리</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 To-do List</h1>
            <p class="subtitle">오늘 할 일을 관리하세요</p>
        </header>

        <main>
            <div class="input-section">
                <input
                    type="text"
                    id="todoInput"
                    placeholder="할 일을 입력하세요..."
                    autocomplete="off"
                />
                <button id="addBtn" class="btn-add">추가</button>
            </div>

            <div class="filter-section">
                <div class="stats">
                    <span id="totalCount">전체: 0</span>
                    <span id="activeCount">진행중: 0</span>
                    <span id="completedCount">완료: 0</span>
                </div>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">전체</button>
                    <button class="filter-btn" data-filter="active">진행중</button>
                    <button class="filter-btn" data-filter="completed">완료</button>
                </div>
            </div>

            <ul id="todoList" class="todo-list">
                <!-- 할 일 항목들이 동적으로 추가됩니다 -->
            </ul>

            <div id="emptyState" class="empty-state">
                <p>📋 등록된 할 일이 없습니다</p>
                <p class="empty-subtitle">위에서 새로운 할 일을 추가해보세요</p>
            </div>

            <div class="actions">
                <button id="clearCompletedBtn" class="btn-clear">완료된 항목 삭제</button>
            </div>
        </main>

        <footer class="main-footer">
            <p>할 일 관리를 위한 To-do List 앱</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
